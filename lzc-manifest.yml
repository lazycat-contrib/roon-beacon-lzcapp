application:
  subdomain: roon-beacon
  background_task: true
  multi_instance: false
  upstreams:
    - location: /
      backend: http://host.lzcapp:39339/
  health_check:
    test_url: http://host.lzcapp:39339/api/health
    start_period: 30s
  injects:
    - id: roon-beacon-gateway-auth
      on: request
      auth_required: true
      when:
        - /api/*
      do: |
        ctx.headers.set("Authorization", "Bearer {{ stable_secret "roon_beacon_web_token" | sha256sum }}");
        ctx.headers.set("Host", ctx.request.host);
services:
  roon-beacon:
    # upstream: ghcr.io/ca-x/roon-beacon:0.3.1
    image: ghcr.1ms.run/ca-x/roon-beacon:0.3.1
    network_mode: host
    command: --web-bind 0.0.0.0:39339 --data-dir /data --enable-audio
    environment:
      - ROON_BEACON_WEB_TOKEN={{ stable_secret "roon_beacon_web_token" | sha256sum }}
    binds:
      - /lzcapp/var/data:/data
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:39339/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
usage: |
  在 Roon「设置 → 扩展」启用 Roon Beacon 后，即可使用网页遥控。
  浏览器收听：在 Roon「设置 → 音频」启用 Roon Beacon Web，选择该输出并播放；然后在网页点击加入收听。
  多网卡设备可在网页设置中选择 AirPlay 接收网卡；保存后请重新选择 Roon 输出并加入收听，不影响手机播放控制。
  Web 监听 39339/TCP；应用采用 host 网络，需要与 Roon Core 位于可互通的局域网。
  通过懒猫入口访问可免密；直接访问主机端口仍需令牌。不要将该端口暴露到公网。
  音频使用 AirPlay → MP3 实验性链路，并非原生 RAAT / Roon Bridge；有损、有缓冲延迟，多浏览器不保证同步。
