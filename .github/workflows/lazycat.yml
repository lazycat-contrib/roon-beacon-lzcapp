name: Publish LazyCat LPK
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Validate without publishing
        type: boolean
        default: true
        required: true
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: lazycat-publish-roon-beacon
  cancel-in-progress: false
jobs:
  lazycat:
    uses: ca-x/lazycat-github-action/.github/workflows/lazycat.yml@v1
    with:
      operation: auto
      dry-run: ${{ github.event_name != 'schedule' && inputs.dry-run }}
      config: .github/lazycat-action.yml
      image-id: roon-beacon
      toolchains: none
      versioned-release-asset: true
    secrets:
      APPSTORE_URL: ${{ secrets.APPSTORE_URL }}
      APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
      PRIVATE_STORE_GROUP_CODES: ${{ secrets.PRIVATE_STORE_GROUP_CODES }}
